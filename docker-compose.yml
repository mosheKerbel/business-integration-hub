services:
  hub-postgres:
    image: postgres:16-alpine
    container_name: bih-hub-postgres
    environment:
      POSTGRES_USER: bih
      POSTGRES_PASSWORD: bih
      POSTGRES_DB: bih_hub
    ports:
      - '${BIH_POSTGRES_PORT:-15432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bih -d bih_hub']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - bih_hub_pgdata:/var/lib/postgresql/data

volumes:
  bih_hub_pgdata:
